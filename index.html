<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Vault Pro — Elite Prompt & AI Tool Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(99, 102, 241, 0.25); }
    .glass-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(148, 163, 184, 0.15); transition: all 0.2s ease; }
    .glass-card:active { transform: scale(0.99); border-color: rgba(99, 102, 241, 0.6); }
    .var-highlight { background: rgba(99, 102, 241, 0.3); color: #c7d2fe; padding: 2px 6px; border-radius: 4px; font-weight: 600; border: 1px dashed rgba(129, 140, 248, 0.6); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 glass border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-extrabold text-white">AI Vault Pro</h1>
          <p class="text-xs text-slate-400">Best Prompts & Free AI Tools</p>
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-800">
        <button onclick="switchMainTab('prompts')" id="tab-prompts" class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold bg-indigo-600 text-white flex items-center gap-1.5">
          <i data-lucide="terminal" class="w-4 h-4"></i> Prompts (<span id="count-prompts">0</span>)
        </button>
        <button onclick="switchMainTab('tools')" id="tab-tools" class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-400 flex items-center gap-1.5">
          <i data-lucide="cpu" class="w-4 h-4"></i> AI Tools (<span id="count-tools">0</span>)
        </button>
        <button onclick="switchMainTab('favorites')" id="tab-favorites" class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-400 flex items-center gap-1.5">
          <i data-lucide="star" class="w-4 h-4"></i> Saved (<span id="count-favs">0</span>)
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button onclick="openAddModal()" class="px-4 py-2 rounded-xl bg-indigo-600 active:bg-indigo-500 text-white font-semibold text-xs sm:text-sm flex items-center gap-1.5 shadow-lg">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> + नया प्रॉम्प्ट
        </button>
      </div>
    </div>
  </header>

  <!-- SEARCH & CATEGORIES -->
  <section class="max-w-6xl mx-auto w-full px-4 pt-6 pb-3">
    <div class="glass rounded-2xl p-4 sm:p-5">
      <div class="flex flex-col gap-3">
        <div class="relative w-full">
          <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-3.5 top-3"></i>
          <input
            type="text"
            id="search-input"
            oninput="renderContent()"
            placeholder="प्रॉम्प्ट या टूल सर्च करें (जैसे: Video, IPO, Website)..."
            class="w-full pl-11 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500"
          />
        </div>

        <div class="flex flex-wrap gap-2 pt-1">
          <button onclick="setCategory('All')" data-cat="All" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white">All</button>
          <button onclick="setCategory('Coding & Apps')" data-cat="Coding & Apps" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300">Coding & Apps</button>
          <button onclick="setCategory('Video & Image AI')" data-cat="Video & Image AI" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300">Video & Image AI</button>
          <button onclick="setCategory('Finance & Market')" data-cat="Finance & Market" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300">Finance & Market</button>
          <button onclick="setCategory('Productivity')" data-cat="Productivity" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300">Productivity</button>
        </div>
      </div>
    </div>
  </section>

  <!-- CARDS GRID -->
  <main class="max-w-6xl mx-auto w-full px-4 py-4 pb-16 flex-1">
    <div id="content-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- CUSTOMIZE PROMPT MODAL -->
  <div id="customizer-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass rounded-2xl max-w-xl w-full p-5 border border-indigo-500/40 max-h-[90vh] overflow-y-auto">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div>
          <span id="modal-category" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300"></span>
          <h2 id="modal-title" class="text-lg font-bold text-white mt-2"></h2>
        </div>
        <button onclick="closeCustomizer()" class="text-slate-400 p-1"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>

      <div id="variable-inputs-box" class="mb-4 space-y-3 bg-slate-900 p-4 rounded-xl border border-slate-800">
        <p class="text-xs font-semibold text-indigo-300">⚡ नीचे बॉक्स में अपना टॉपिक लिखें, प्रॉम्प्ट अपने आप तैयार हो जाएगा:</p>
        <div id="variable-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>

      <div class="mb-5">
        <label class="text-xs font-semibold text-slate-400 block mb-2">तैयार प्रॉम्प्ट (Live Preview):</label>
        <div id="modal-live-preview" class="p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-xs sm:text-sm text-slate-200 whitespace-pre-wrap leading-relaxed font-mono"></div>
      </div>

      <div class="flex items-center justify-end gap-3">
        <button onclick="closeCustomizer()" class="px-4 py-2.5 rounded-xl bg-slate-800 text-xs sm:text-sm text-slate-300">बंद करें</button>
        <button onclick="copyCustomizedPrompt()" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold text-xs sm:text-sm flex items-center gap-2">
          <i data-lucide="copy" class="w-4 h-4"></i> Copy Final Prompt
        </button>
      </div>
    </div>
  </div>

  <!-- ADD NEW PROMPT MODAL -->
  <div id="add-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass rounded-2xl max-w-lg w-full p-5 border border-indigo-500/40">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-white">+ नया प्रॉम्प्ट सेव करें</h2>
        <button onclick="closeAddModal()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-3.5">
        <div>
          <label class="text-xs text-slate-300 block mb-1">प्रॉम्प्ट का नाम</label>
          <input id="new-title" type="text" placeholder="जैसे: Website Idea Generator" class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-300 block mb-1">कैटेगरी</label>
            <select id="new-category" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white">
              <option value="Coding & Apps">Coding & Apps</option>
              <option value="Video & Image AI">Video & Image AI</option>
              <option value="Finance & Market">Finance & Market</option>
              <option value="Productivity">Productivity</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-300 block mb-1">AI मॉडल</label>
            <input id="new-model" type="text" value="Gemini 4 Argon" class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white" />
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-300 block mb-1">प्रॉम्प्ट लिखें (टिप: [TOPIC] लिखने पर उसका बॉक्स अपने आप बन जाएगा)</label>
          <textarea id="new-content" rows="4" placeholder="Create a complete plan about [TOPIC]..." class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white"></textarea>
        </div>
        <button onclick="saveNewPrompt()" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-semibold text-sm">
          सेव करें (Save Prompt)
        </button>
      </div>
    </div>
  </div>

  <!-- NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-xl font-semibold text-xs sm:text-sm flex items-center gap-2">
    <i data-lucide="check-circle-2" class="w-4 h-4"></i> <span id="toast-msg">कॉपी हो गया!</span>
  </div>

  <script>
    const defaultPrompts = [
      {
        id: 'p1',
        title: 'Full Website & App Builder Prompt',
        category: 'Coding & Apps',
        model: 'Gemini 4 Argon',
        favorite: true,
        content: `Build a complete, modern single-file HTML/Tailwind/JS web app for [WEBSITE_IDEA]. Include main features: [MAIN_FEATURES]. Write 100% complete code with mobile/tablet responsive dark UI and localStorage support.`
      },
      {
        id: 'p2',
        title: '4K Cinematic AI Video Director',
        category: 'Video & Image AI',
        model: 'Veo / Sora / Midjourney',
        favorite: true,
        content: `Create an ultra-detailed 4K photorealistic cinematic video prompt showing [SCENE_OR_DANCE]. Outfit and details: [ATTIRE_DETAILS]. Camera: 85mm lens, golden hour lighting, 60fps smooth motion, moody [LIGHTING_MOOD] vibe.`
      },
      {
        id: 'p3',
        title: 'IPO & Stock Market Deep Analyzer',
        category: 'Finance & Market',
        model: 'Gemini 4 Argon',
        favorite: true,
        content: `Analyze the [COMPANY_OR_IPO_NAME] for [INVESTMENT_GOAL]. Check QIB/NII subscription demand, Grey Market Premium (GMP), peer valuation, key risks, and give a clear step-by-step conclusion in simple Hindi.`
      },
      {
        id: 'p4',
        title: 'Mutual Fund SIP Portfolio Checker',
        category: 'Finance & Market',
        model: 'Gemini 4 Argon',
        favorite: false,
        content: `Review my SIP portfolio having [FUNDS_LIST] with a monthly investment of [MONTHLY_AMOUNT]. Check overlap between Mid-Cap, Small-Cap, Flexi-Cap, and Gold ETF, and suggest improvements for long-term wealth.`
      },
      {
        id: 'p5',
        title: 'Master Topic Teacher (Basic to Advanced)',
        category: 'Productivity',
        model: 'Gemini 4 Argon',
        favorite: false,
        content: `Teach me [TOPIC_NAME] from zero to advanced level in very simple Hindi. Use real-life examples, avoid heavy jargon, and guide me step-by-step.`
      },
      {
        id: 'p6',
        title: 'Instant Code Error & Bug Fixer',
        category: 'Coding & Apps',
        model: 'Gemini 4 Argon',
        favorite: false,
        content: `Fix this error: [ERROR_MESSAGE] in my [PROJECT_NAME]. Tell me why it happened in 2 simple Hindi lines and give the complete updated code.`
      }
    ];

    const aiTools = [
      { id: 't1', name: 'Gemini 4 Argon', category: 'Coding & Apps', limit: 'Free / 1M Output', desc: 'कोडिंग, वेबसाइट ऑटोमेशन और गहरी रिसर्च के लिए मुख्य AI।', url: 'https://gemini.google.com' },
      { id: 't2', name: 'GitHub', category: 'Coding & Apps', limit: '100% Free Forever', desc: 'आपकी वेबसाइट की फाइलों को सेव रखने और ऑटो-डिप्लॉय करने का प्लेटफॉर्म।', url: 'https://github.com' },
      { id: 't3', name: 'Vercel', category: 'Coding & Apps', limit: '100% Free Hosting', desc: 'GitHub से जुड़कर आपकी वेबसाइट को इंटरनेट पर लाइव करने का टूल।', url: 'https://vercel.com' },
      { id: 't4', name: 'Supabase', category: 'Coding & Apps', limit: '500MB Free Database', desc: 'वेबसाइट में यूजर लॉगिन और ऑनलाइन डेटा सेव करने का फ्री डेटाबेस।', url: 'https://supabase.com' }
    ];

    let prompts = JSON.parse(localStorage.getItem('aivault_prompts_v2')) || defaultPrompts;
    let currentTab = 'prompts';
    let currentCategory = 'All';
    let activePrompt = null;
    let currentVarValues = {};

    function saveToStorage() {
      localStorage.setItem('aivault_prompts_v2', JSON.stringify(prompts));
      updateCounts();
    }

    function updateCounts() {
      document.getElementById('count-prompts').innerText = prompts.length;
      document.getElementById('count-tools').innerText = aiTools.length;
      document.getElementById('count-favs').innerText = prompts.filter(p => p.favorite).length;
    }

    function switchMainTab(tab) {
      currentTab = tab;
      ['prompts', 'tools', 'favorites'].forEach(t => {
        const btn = document.getElementById('tab-' + t);
        btn.className = t === tab
          ? 'px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold bg-indigo-600 text-white flex items-center gap-1.5'
          : 'px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-400 flex items-center gap-1.5';
      });
      renderContent();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = btn.dataset.cat === cat
          ? 'cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white'
          : 'cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300';
      });
      renderContent();
    }

    function extractVariables(text) {
      const matches = text.match(/\[([A-Z0-9_]+)\]/g) || [];
      return [...new Set(matches.map(m => m.slice(1, -1)))];
    }

    function toggleFavorite(id) {
      prompts = prompts.map(p => p.id === id ? { ...p, favorite: !p.favorite } : p);
      saveToStorage();
      renderContent();
    }

    function copyText(text, msg = 'प्रॉम्प्ट कॉपी हो गया!') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      } else {
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
      }
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2200);
    }

    function openCustomizer(id) {
      activePrompt = prompts.find(p => p.id === id);
      if (!activePrompt) return;
      currentVarValues = {};
      document.getElementById('modal-category').innerText = activePrompt.category + ' • ' + activePrompt.model;
      document.getElementById('modal-title').innerText = activePrompt.title;

      const vars = extractVariables(activePrompt.content);
      const fieldsContainer = document.getElementById('variable-fields');
      const box = document.getElementById('variable-inputs-box');

      if (vars.length === 0) {
        box.classList.add('hidden');
      } else {
        box.classList.remove('hidden');
        fieldsContainer.innerHTML = vars.map(v => `
          <div>
            <label class="text-xs font-medium text-slate-300 block mb-1">[${v}]</label>
            <input type="text" oninput="updateVar('${v}', this.value)" placeholder="${v.replace(/_/g, ' ')} लिखें..."
              class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white focus:border-indigo-500 focus:outline-none" />
          </div>
        `).join('');
      }

      updateLivePreview();
      document.getElementById('customizer-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function updateVar(varName, val) {
      currentVarValues[varName] = val;
      updateLivePreview();
    }

    function getCompiledPromptText() {
      if (!activePrompt) return '';
      let text = activePrompt.content;
      Object.keys(currentVarValues).forEach(k => {
        if (currentVarValues[k] && currentVarValues[k].trim() !== '') {
          text = text.replaceAll(`[${k}]`, currentVarValues[k]);
        }
      });
      return text;
    }

    function updateLivePreview() {
      if (!activePrompt) return;
      let html = activePrompt.content.replace(/\[([A-Z0-9_]+)\]/g, (match, varName) => {
        const val = currentVarValues[varName];
        return `<span class="var-highlight">${val && val.trim() ? val : match}</span>`;
      });
      document.getElementById('modal-live-preview').innerHTML = html;
    }

    function copyCustomizedPrompt() {
      copyText(getCompiledPromptText(), 'कस्टम प्रॉम्प्ट कॉपी हो गया!');
      closeCustomizer();
    }

    function closeCustomizer() {
      document.getElementById('customizer-modal').classList.add('hidden');
    }

    function openAddModal() {
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function saveNewPrompt() {
      const title = document.getElementById('new-title').value.trim();
      const category = document.getElementById('new-category').value;
      const model = document.getElementById('new-model').value.trim() || 'Gemini 4 Argon';
      const content = document.getElementById('new-content').value.trim();

      if (!title || !content) {
        alert('कृपया प्रॉम्प्ट का नाम और टेक्स्ट दोनों भरें!');
        return;
      }

      prompts.unshift({
        id: 'p_' + Date.now(),
        title,
        category,
        model,
        favorite: true,
        content
      });

      saveToStorage();
      closeAddModal();
      document.getElementById('new-title').value = '';
      document.getElementById('new-content').value = '';
      renderContent();
      copyText(content, 'नया प्रॉम्प्ट जुड़ गया!');
    }

    function renderContent() {
      const grid = document.getElementById('content-grid');
      const query = document.getElementById('search-input').value.toLowerCase();
      updateCounts();

      if (currentTab === 'tools') {
        const filteredTools = aiTools.filter(t =>
          (currentCategory === 'All' || t.category === currentCategory) &&
          (t.name.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query))
        );
        grid.innerHTML = filteredTools.map(t => `
          <div class="glass-card rounded-2xl p-5 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300">${t.category}</span>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300">${t.limit}</span>
              </div>
              <h3 class="text-base font-bold text-white mb-1.5">${t.name}</h3>
              <p class="text-xs sm:text-sm text-slate-300 mb-4">${t.desc}</p>
            </div>
            <a href="${t.url}" target="_blank" class="w-full py-2.5 rounded-xl bg-slate-800 text-center text-white text-xs sm:text-sm font-semibold flex items-center justify-center gap-2">
              Open Website <i data-lucide="external-link" class="w-4 h-4"></i>
            </a>
          </div>
        `).join('');
        lucide.createIcons();
        return;
      }

      const filteredPrompts = prompts.filter(p => {
        const matchesTab = currentTab === 'favorites' ? p.favorite : true;
        const matchesCat = currentCategory === 'All' || p.category === currentCategory;
        const matchesSearch = p.title.toLowerCase().includes(query) || p.content.toLowerCase().includes(query);
        return matchesTab && matchesCat && matchesSearch;
      });

      grid.innerHTML = filteredPrompts.map(p => {
        const vars = extractVariables(p.content);
        return `
          <div class="glass-card rounded-2xl p-5 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300">${p.category}</span>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-slate-400">${p.model}</span>
                  <button onclick="toggleFavorite('${p.id}')" class="${p.favorite ? 'text-amber-400' : 'text-slate-500'}">
                    <i data-lucide="star" class="w-4 h-4 ${p.favorite ? 'fill-amber-400' : ''}"></i>
                  </button>
                </div>
              </div>
              <h3 class="text-base font-bold text-white mb-2">${p.title}</h3>
              <p class="text-xs text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800 font-mono mb-3 leading-relaxed">${p.content}</p>
              ${vars.length > 0 ? `
                <div class="flex flex-wrap gap-1.5 mb-4">
                  ${vars.map(v => `<span class="text-[11px] px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800/50">[${v}]</span>`).join('')}
                </div>
              ` : ''}
            </div>
            <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-slate-800">
              <button onclick="openCustomizer('${p.id}')" class="py-2.5 px-3 rounded-xl bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 text-xs font-semibold flex items-center justify-center gap-1.5">
                <i data-lucide="sliders" class="w-3.5 h-3.5"></i> Customize
              </button>
              <button onclick="copyText(\`${p.content.replace(/`/g, '\\`')}\`)" class="py-2.5 px-3 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center justify-center gap-1.5">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy
              </button>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    renderContent();
  </script>
</body>
</html>
